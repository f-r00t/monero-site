name: gh-actions/site

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '2.7', '3.0.1' ]
    name: Ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: install bundler
        run: gem install bundler:2.2.23
      - name: bundle install
        run: bundle install --jobs 4 --retry 3
      - name: build site
        run: bundle exec jekyll build --limit-posts 10

  link-check:
    name: Link check
    runs-on: ubuntu-22.04
    env:
      HTMLTEST_VERSION: 0.17.0
    steps:
      - uses: actions/checkout@v6
      # Ruby 3.1: the site's _plugins use File.exists? (removed in Ruby 3.2).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: install bundler
        run: gem install bundler:2.2.23
      - name: bundle install
        run: bundle install --jobs 4 --retry 3
      # Full build (no --limit-posts) so every post's links are checked.
      - name: build site
        run: bundle exec jekyll build
      - name: install htmltest
        run: |
          curl -fsSL -o /tmp/htmltest.tar.gz \
            "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/htmltest.tar.gz htmltest
          ./htmltest --version
      - name: check links
        run: ./htmltest
